<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d13">
    <title>ကြည့်ရှုနေသည် — ဘစ်ကြီး</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<header class="header">
    <div class="header-left">
        <a class="brand" href="index.html">
            <span class="brand-mark">⚽</span>
            <span class="brand-name">ဘစ်ကြီး</span>
        </a>
    </div>
    <div class="header-right">
        <span class="live-badge" id="ads-badge"><span class="live-dot" style="background:var(--accent)"></span><span class="lbl">ကြော်ငြာမရှိ</span></span>
        <a href="index.html" class="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            ပွဲစဉ်စာမျက်နှာ
        </a>
    </div>
</header>

<main class="container">
    <!-- Error state -->
    <div class="state" id="error-page" style="display:none">
        <div class="state-icon">🔒</div>
        <div class="state-title" style="color:var(--live)">ရယူခွင့် မရှိပါ</div>
        <div class="state-msg" id="error-msg">ကုဒ်နံပါတ် မှန်ကန်မှ ပွဲစဉ်ကြည့်နိုင်ပါတယ်။</div>
        <a href="index.html" class="btn btn-primary">← ပွဲစဉ်စာမျက်နှာသို့</a>
    </div>

    <!-- Player -->
    <div id="player-section" style="display:none">
        <div class="player-box">
            <video id="video" controls playsinline></video>
            <div class="player-placeholder" id="placeholder">
                <div>
                    <div style="font-size:42px;margin-bottom:10px">⚽</div>
                    <p style="font-size:13px">ခဏစောင့်ပါ...</p>
                </div>
            </div>
            <div class="player-loading" id="loading"><div class="spinner lg"></div><span>Stream ပြင်ဆင်နေသည်...</span></div>
            <div class="quality-btns" id="quality-btns" style="display:none">
                <button class="q-btn active" onclick="setQuality('hd', this)">HD</button>
                <button class="q-btn" onclick="setQuality('sd', this)">SD</button>
            </div>
            <div class="stream-status" id="stream-status"></div>
        </div>

        <div class="iframe-trap" id="iframe-trap"></div>

        <div class="match-info" id="info">
            <div class="match-header">
                <div class="league-info" id="i-league"></div>
                <span class="status st-live" id="i-status"></span>
            </div>
            <div class="teams-row">
                <div class="team"><img id="i-h-badge" alt=""><span class="team-name" id="i-h-name"></span></div>
                <div class="score" id="i-score"></div>
                <div class="team"><img id="i-a-badge" alt=""><span class="team-name" id="i-a-name"></span></div>
            </div>
            <div class="venue" id="i-venue"></div>
        </div>
    </div>
</main>

<footer class="footer">
    <span>© 2026 ဘစ်ကြီး — ဘောလုံး တိုက်ရိုက်ကြည့်ရန်</span>
</footer>

<script>
const API_PROXY = '/api/matches';
const CODE_API = '/api/code';
const video = document.getElementById('video');
const iframeTrap = document.getElementById('iframe-trap');
let hls = null;
let currentStreams = null;
let currentQuality = 'hd';
let validated = false;

const statusMap = {
    'inprogress': 'ကစားနေသည်',
    'finished': 'ပြီးဆုံး',
    'upcoming': 'မကစားရသေး',
    '1st half': 'ပထမပိုင်း',
    '2nd half': 'ဒုတိယပိုင်း',
    'halftime': 'အနားယူနေသည်',
    'LIVE': 'တိုက်ရိုက်',
    'FT': 'ပြီးဆုံး',
};

function getStatus(status, detail) {
    if (detail && statusMap[detail]) return statusMap[detail];
    if (statusMap[status]) return statusMap[status];
    return detail || status;
}

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function goHome() { window.location.href = 'index.html'; }

async function api(params) {
    const token = new URLSearchParams(window.location.search).get('token') || '';
    if (token) params.token = token;
    const r = await fetch(API_PROXY + '?' + new URLSearchParams(params));
    return r.json();
}

window.open = function () { return null; };

// === Player ===
function playStream(url) {
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('loading').classList.add('active');
    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, startLevel: -1 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    if (currentQuality === 'hd' && currentStreams && currentStreams.sd && currentStreams.sd.length) {
                        setQuality('sd');
                    } else {
                        hls.startLoad();
                    }
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
        }, { once: true });
    }
}

function setQuality(q, el) {
    currentQuality = q;
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
    (el || event.target).classList.add('active');
    if (currentStreams && currentStreams[q] && currentStreams[q].length) playStream(currentStreams[q][0]);
}

function startM3u8Interceptor(timeout = 15000) {
    return new Promise((resolve) => {
        let foundM3u8 = null;
        performance.clearResourceTimings();
        const observer = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
                if (entry.name.includes('.m3u8') && !foundM3u8) {
                    foundM3u8 = entry.name;
                    observer.disconnect();
                    resolve(foundM3u8);
                }
            }
        });
        observer.observe({ entryTypes: ['resource'] });
        setTimeout(() => {
            if (!foundM3u8) {
                for (const r of performance.getEntriesByType('resource')) {
                    if (r.name.includes('.m3u8')) { foundM3u8 = r.name; break; }
                }
            }
            observer.disconnect();
            resolve(foundM3u8);
        }, timeout);
    });
}

function killIframe() { iframeTrap.innerHTML = ''; }

async function loadStreamAdFree(embedUrl) {
    showStatus('⏳ Stream ပြင်ဆင်နေသည်...', 'warn');
    const m3u8Promise = startM3u8Interceptor(10000);
    iframeTrap.innerHTML = '<iframe src="' + embedUrl + '" width="1" height="1" frameborder="0" allow="encrypted-media" allowfullscreen></iframe>';
    const m3u8 = await m3u8Promise;
    killIframe();
    if (m3u8) {
        const sdM3u8 = m3u8.replace('_lhd', '_lsd');
        currentStreams = { hd: [m3u8], sd: [sdM3u8 !== m3u8 ? sdM3u8 : ''] };
        document.getElementById('quality-btns').style.display = 'flex';
        currentQuality = 'hd';
        const ph = document.getElementById('placeholder');
        ph.innerHTML = '';
        ph.style.display = 'none';
        playStream(m3u8);
        showStatus('✅ ကြော်ငြာမရှိ Stream', 'ok');
        updateBadge(true);
        return true;
    }
    killIframe();
    return false;
}

function showStatus(text, type) {
    const el = document.getElementById('stream-status');
    el.textContent = text;
    el.style.display = 'block';
    el.className = 'stream-status ' + (type || '');
    setTimeout(() => { el.style.display = 'none'; }, 8000);
}

function updateBadge(adFree) {
    const badge = document.getElementById('ads-badge');
    if (adFree) {
        badge.innerHTML = '<span class="live-dot" style="background:var(--accent)"></span><span class="lbl">ကြော်ငြာမရှိ</span>';
    } else {
        badge.innerHTML = '<span class="live-dot" style="background:var(--live)"></span><span class="lbl">ကြော်ငြာပါ</span>';
    }
}

async function init() {
    const params = new URLSearchParams(window.location.search);
    const matchId = params.get('id');
    const token = params.get('token');

    if (!matchId) { goHome(); return; }
    if (!token) { showError('တရားဝင် လမ်းကြောင်းမှ ဝင်ရောက်ပါ။'); return; }

    try {
        const resp = await fetch(CODE_API + '?action=check&token=' + encodeURIComponent(token));
        const data = await resp.json();
        if (!data.valid) { showError('ကုဒ်ထည့်ပြီးမှ ပွဲစဉ်ကြည့်နိုင်ပါတယ်။'); return; }
    } catch (e) {
        console.warn('Token check failed, proceeding anyway:', e);
    }

    validated = true;
    document.getElementById('player-section').style.display = 'block';
    document.getElementById('error-page').style.display = 'none';

    try {
        const detail = await api({ type: 'detail', id: matchId });
        if (!detail.success) { showError('ပွဲစဉ်အချက်အလက် ရယူမရပါ။'); return; }
        playMatch(detail);
    } catch (e) {
        showError('ဆက်သွယ်မှု အမှားရှိနေသည်။');
    }
}

function showError(msg) {
    document.getElementById('error-page').style.display = 'block';
    document.getElementById('player-section').style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
}

async function playMatch(detail) {
    const m = detail.data.match_info;
    const info = document.getElementById('info');

    document.getElementById('i-league').innerHTML = '<img src="' + esc(m.league.flag) + '" alt="" onerror="this.style.visibility=\'hidden\'"><span>' + esc(m.league.name) + ' • ' + esc(m.league.country) + '</span>';
    document.getElementById('i-status').textContent = getStatus(m.status, m.status_detail);
    document.getElementById('i-h-badge').src = m.teams.home.badge;
    document.getElementById('i-h-name').textContent = m.teams.home.name;
    document.getElementById('i-a-badge').src = m.teams.away.badge;
    document.getElementById('i-a-name').textContent = m.teams.away.name;
    document.getElementById('i-score').textContent = m.score.display;

    const v = detail.data.info && detail.data.info.venue;
    document.getElementById('i-venue').textContent = v ? v.stadium + ' • ' + v.city : '';
    info.style.display = 'block';

    const sources = detail.data.sources || [];
    const streamapiSource = sources.find(s => s.embedUrl && s.embedUrl.includes('streamapi.cc'));
    const sport99Source = sources.find(s => s.embedUrl && s.embedUrl.includes('sport99.live'));

    if (streamapiSource) {
        showStatus('⏳ Stream ရှာနေသည်...', 'warn');
        if (await loadStreamAdFree(streamapiSource.embedUrl)) return;
    }
    if (sport99Source) {
        showStatus('⏳ နောက်ဆုံးနည်းလမ်း စမ်းသပ်နေ...', 'warn');
        if (await loadStreamAdFree(sport99Source.embedUrl)) return;
    }

    if (sources.length) {
        currentStreams = null;
        document.getElementById('quality-btns').style.display = 'none';
        document.getElementById('loading').classList.remove('active');
        const ph = document.getElementById('placeholder');
        ph.innerHTML = '<iframe src="' + sources[0].embedUrl + '" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe>';
        ph.style.display = 'block';
        video.style.display = 'none';
        showStatus('📺 ပွဲစဉ်ဖွင့်နေသည်...', 'warn');
        updateBadge(false);
    } else {
        document.getElementById('loading').classList.remove('active');
        showStatus('❌ ပွဲစဉ်မစတင်ရသေးပါ', 'err');
    }
}

init();
</script>
</body>
</html>
