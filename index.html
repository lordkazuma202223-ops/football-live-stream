<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ ဘစ်ကြီး - ဘောလုံးတိုက်ရိုက်ကြည့်</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

        .header{background:linear-gradient(135deg,#0f0f1a,#1a1a2e);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e94560;position:sticky;top:0;z-index:100}
        .header-left{display:flex;align-items:center;gap:10px}
        .brand{font-size:20px;font-weight:900;background:linear-gradient(90deg,#e94560,#ff6b6b,#ffa500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
        .brand-icon{font-size:22px}
        .no-ads{background:#28a745;color:#fff;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:bold;display:flex;align-items:center;gap:4px}
        .no-ads::before{content:'🛡️'}
        .live-badge{background:#e94560;color:#fff;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:bold;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .header-btns{display:flex;gap:8px;align-items:center}
        .refresh-btn{background:rgba(255,255,255,.08);color:#aaa;border:1px solid rgba(255,255,255,.15);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:.2s}
        .refresh-btn:hover{background:rgba(255,255,255,.15);color:#fff}

        .container{max-width:1100px;margin:0 auto;padding:14px}

        /* Player */
        .player-box{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(233,69,96,.1);margin-bottom:14px}
        .player-box video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
        .player-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111;color:#444}
        .player-loading{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:10}
        .player-loading.active{display:flex}
        .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .quality-btns{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:6px}
        .q-btn{background:rgba(0,0,0,.7);color:#ccc;border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;transition:.2s}
        .q-btn:hover,.q-btn.active{background:#e94560;color:#fff;border-color:#e94560}

        /* Match Info */
        .match-info{background:linear-gradient(135deg,#0f0f1a,#1a1a2e);border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid rgba(233,69,96,.15);display:none}
        .match-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
        .league-info{display:flex;align-items:center;gap:8px;font-size:11px;color:#666}
        .league-info img{width:20px;height:20px;border-radius:3px}
        .status{font-size:10px;padding:3px 8px;border-radius:16px;font-weight:600}
        .st-live{background:rgba(233,69,96,.2);color:#e94560}
        .st-up{background:rgba(52,152,219,.2);color:#3498db}
        .st-ft{background:rgba(149,165,166,.2);color:#95a5a6}
        .teams-row{display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 0}
        .team{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:90px}
        .team img{width:40px;height:40px}
        .team-name{font-size:12px;font-weight:600;text-align:center}
        .score{font-size:24px;font-weight:900;color:#e94560;min-width:60px;text-align:center}
        .venue{font-size:10px;color:#555;text-align:center}

        /* Match List */
        .section-title{font-size:12px;color:#888;margin-bottom:8px;padding:0 4px;display:flex;align-items:center;gap:6px}
        .match-list{display:flex;flex-direction:column;gap:8px}
        .match-card{background:linear-gradient(135deg,#0f0f1a,#1a1a2e);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;cursor:pointer;transition:.2s}
        .match-card:hover{border-color:rgba(233,69,96,.4);transform:translateY(-1px)}
        .match-card.active{border-color:#e94560;background:linear-gradient(135deg,#1a0a15,#2a1a2e)}
        .card-teams{display:flex;align-items:center;justify-content:space-between}
        .card-team{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;min-width:0;flex:1}
        .card-team img{width:24px;height:24px;flex-shrink:0}
        .card-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .card-score{font-size:14px;font-weight:800;color:#e94560;min-width:50px;text-align:center;flex-shrink:0}
        .card-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:#555}
        .loading{text-align:center;padding:20px;color:#555;font-size:12px}

        /* Ad-free status indicator */
        .stream-status{position:absolute;bottom:10px;left:10px;z-index:20;background:rgba(0,0,0,.7);color:#aaa;padding:3px 8px;border-radius:4px;font-size:9px;display:none}
        .stream-status.adfree{color:#28a745}

        @media(max-width:600px){
            .header{padding:10px 14px}
            .brand{font-size:16px}
            .container{padding:10px}
            .card-team{font-size:11px}
            .card-score{font-size:12px;min-width:40px}
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <span class="brand-icon">⚽</span>
        <span class="brand">ဘစ်ကြီး</span>
        <span class="no-ads" id="ads-badge">ကြော်ငြာမရှိ</span>
    </div>
    <div class="header-btns">
        <span class="live-badge">● တိုက်ရိုက်</span>
        <button class="refresh-btn" onclick="loadMatches()">🔄</button>
    </div>
</div>

<div class="container">
    <div class="player-box">
        <video id="video" controls playsinline></video>
        <div class="player-placeholder" id="placeholder">
            <div style="text-align:center">
                <div style="font-size:40px;margin-bottom:10px">⚽</div>
                <p style="font-size:13px">ပွဲစဉ်တစ်ခုခု ရွေးချယ်ပါ</p>
            </div>
        </div>
        <div class="player-loading" id="loading"><div class="spinner"></div></div>
        <div class="quality-btns" id="quality-btns" style="display:none">
            <button class="q-btn active" onclick="setQuality('hd')">HD</button>
            <button class="q-btn" onclick="setQuality('sd')">SD</button>
        </div>
        <div class="stream-status" id="stream-status"></div>
    </div>

    <div class="match-info" id="info">
        <div class="match-header">
            <div class="league-info" id="i-league"></div>
            <span class="status st-live" id="i-status"></span>
        </div>
        <div class="teams-row">
            <div class="team"><img id="i-h-badge"><span class="team-name" id="i-h-name"></span></div>
            <div class="score" id="i-score"></div>
            <div class="team"><img id="i-a-badge"><span class="team-name" id="i-a-name"></span></div>
        </div>
        <div class="venue" id="i-venue"></div>
    </div>

    <div class="section-title">📋 ယနေ့ ပွဲစဉ်များ</div>
    <div class="match-list" id="match-list"></div>
</div>

<script>
const API_PROXY = '/api/matches';
const video = document.getElementById('video');
let hls = null;
let currentStreams = null;
let currentQuality = 'hd';
let activeMatchId = null;

// CORS proxy options to try (in order)
const CORS_PROXIES = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `/api/proxy?url=${encodeURIComponent(url)}`
];

// Status translations
const statusMap = {
    'inprogress': 'ကစားနေသည်',
    'finished': 'ပြီးဆုံး',
    'upcoming': 'မကစားရသေး',
    '1st half': 'ပထမပိုင်း',
    '2nd half': 'ဒုတိယပိုင်း',
    'halftime': 'အနားယူနေသည်',
    'LIVE': 'တိုက်ရိုက်',
    'FT': 'ပြီးဆုံး',
};

function getStatus(status, detail) {
    if (detail && statusMap[detail]) return statusMap[detail];
    if (statusMap[status]) return statusMap[status];
    return detail || status;
}

// === API ===
async function api(params) {
    const r = await fetch(API_PROXY + '?' + new URLSearchParams(params));
    return r.json();
}

// === Player ===
function playStream(url) {
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('loading').classList.add('active');

    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            startLevel: -1
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
                console.error('HLS error', data);
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    if (currentQuality === 'hd' && currentStreams && currentStreams.sd && currentStreams.sd.length) {
                        setQuality('sd');
                    } else {
                        hls.startLoad();
                    }
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
        }, {once: true});
    }
}

function setQuality(q) {
    currentQuality = q;
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (currentStreams && currentStreams[q] && currentStreams[q].length) {
        playStream(currentStreams[q][0]);
    }
}

// === Stream Extraction (Client-Side via CORS Proxy) ===
async function extractStream(matchId) {
    const embedUrl = `https://sport99.live/embed/?id=${matchId}&source=rapid`;
    
    // Try each CORS proxy
    for (let i = 0; i < CORS_PROXIES.length; i++) {
        try {
            const proxyUrl = CORS_PROXIES[i](embedUrl);
            const resp = await fetch(proxyUrl);
            const embedHtml = await resp.text();
            
            // Extract stream.php path
            const streamMatch = embedHtml.match(/stream\.php\?[^"\\]+/);
            if (!streamMatch) continue;
            
            const streamPath = streamMatch[0].replace(/&amp;/g, '&');
            const streamUrl = `https://sport99.live/embed/${streamPath}`;
            
            // Fetch stream.php via same CORS proxy
            const streamProxyUrl = CORS_PROXIES[i](streamUrl);
            const streamResp = await fetch(streamProxyUrl);
            const streamHtml = await streamResp.text();
            
            // Check if blocked
            if (streamHtml.includes('ACCESS DENIED') || streamHtml.includes('API ERROR')) {
                continue; // Try next proxy
            }
            
            // Extract m3u8 URLs
            const m3u8Regex = /https?:\/\/[^\s"'\\]+\.m3u8[^\s"'\\]*/g;
            const m3u8Urls = [...new Set(streamHtml.match(m3u8Regex) || [])];
            
            if (m3u8Urls.length) {
                const hd = m3u8Urls.filter(u => u.includes('_lhd') || u.includes('_hd'));
                const sd = m3u8Urls.filter(u => u.includes('_lsd') || u.includes('_sd'));
                const otherSd = m3u8Urls.filter(u => !u.includes('_lhd') && !u.includes('_hd'));
                const allSd = [...sd, ...otherSd];
                const best = (hd.length ? hd : allSd)[0];
                
                return { success: true, best, hd: hd.slice(0, 3), sd: allSd.slice(0, 3), total: m3u8Urls.length, proxy: i };
            }
        } catch (e) {
            console.warn(`CORS proxy ${i} failed:`, e.message);
            continue;
        }
    }
    
    return { success: false };
}

// === Show stream status ===
function showStatus(text, isAdFree) {
    const el = document.getElementById('stream-status');
    el.textContent = text;
    el.style.display = 'block';
    el.className = 'stream-status' + (isAdFree ? ' adfree' : '');
    
    const badge = document.getElementById('ads-badge');
    badge.textContent = isAdFree ? '🛡️ ကြော်ငြာမရှိ' : '⚠️ ကြော်ငြာပါ';
    badge.style.background = isAdFree ? '#28a745' : '#dc3545';
}

// === Matches ===
async function loadMatches() {
    const el = document.getElementById('match-list');
    el.innerHTML = '<div class="loading"><div class="spinner" style="margin:0 auto 8px"></div>ရှာဖွေနေသည်...</div>';
    try {
        const today = new Date().toISOString().split('T')[0];
        const [live, upcoming] = await Promise.all([
            api({type:'matches', sport:'football', status:'inprogress'}),
            api({type:'matches', sport:'football', status:'upcoming', date:today})
        ]);
        const all = [];
        if (live.success && Array.isArray(live.data)) all.push(...live.data);
        if (upcoming.success && Array.isArray(upcoming.data)) all.push(...upcoming.data);

        if (!all.length) { el.innerHTML = '<div class="loading">ပွဲစဉ်မတွေ့ရှိပါ</div>'; return; }

        el.innerHTML = '';
        all.forEach(league => league.matches.forEach(m => {
            const c = document.createElement('div');
            c.className = 'match-card' + (m.id === activeMatchId ? ' active' : '');
            c.onclick = () => showMatch(m.id);

            const sc = m.status === 'inprogress' ? 'st-live' : m.status === 'finished' ? 'st-ft' : 'st-up';
            const st = getStatus(m.status, m.status_detail);

            c.innerHTML = `
                <div class="card-teams">
                    <div class="card-team"><img src="${m.teams.home.badge}"><span>${m.teams.home.name}</span></div>
                    <div class="card-score">${m.score.display||'VS'}</div>
                    <div class="card-team" style="flex-direction:row-reverse"><img src="${m.teams.away.badge}"><span>${m.teams.away.name}</span></div>
                </div>
                <div class="card-meta">
                    <span>${league.league.name} • ${league.league.country}</span>
                    <span class="status ${sc}" style="font-size:9px">${st}</span>
                </div>`;
            el.appendChild(c);
        }));

        // Auto-load first live match
        if (!activeMatchId) {
            for (const l of all) {
                const live = l.matches.find(m => m.status === 'inprogress');
                if (live) { showMatch(live.id); break; }
            }
        }
    } catch(e) {
        el.innerHTML = `<div class="loading">❌ ${e.message}</div>`;
    }
}

async function showMatch(id) {
    activeMatchId = id;
    document.querySelectorAll('.match-card').forEach(c => c.classList.remove('active'));

    try {
        const [detail, streams] = await Promise.all([
            api({type:'detail', id}),
            extractStream(id)
        ]);

        if (!detail.success) return;
        const m = detail.data.match_info;
        const info = document.getElementById('info');

        document.getElementById('i-league').innerHTML = `<img src="${m.league.flag}"><span>${m.league.name} • ${m.league.country}</span>`;
        document.getElementById('i-status').textContent = getStatus(m.status, m.status_detail);
        document.getElementById('i-h-badge').src = m.teams.home.badge;
        document.getElementById('i-h-name').textContent = m.teams.home.name;
        document.getElementById('i-a-badge').src = m.teams.away.badge;
        document.getElementById('i-a-name').textContent = m.teams.away.name;
        document.getElementById('i-score').textContent = m.score.display;

        const v = detail.data.info?.venue;
        document.getElementById('i-venue').textContent = v ? `${v.stadium} • ${v.city}` : '';
        info.style.display = 'block';

        if (streams.success && streams.best) {
            // Ad-free stream via HLS.js
            currentStreams = streams;
            document.getElementById('quality-btns').style.display = streams.hd && streams.hd.length > 0 ? 'flex' : 'none';
            currentQuality = 'hd';
            playStream(streams.best);
            showStatus('✅ Ad-Free Stream', true);
        } else {
            // Fallback to iframe (has ads)
            const src = detail.data.sources;
            if (src && src.length) {
                currentStreams = null;
                document.getElementById('quality-btns').style.display = 'none';
                document.getElementById('placeholder').innerHTML = `<iframe src="${src[0].embedUrl}" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe>`;
                document.getElementById('placeholder').style.display = 'block';
                showStatus('⚠️ ကြော်ငြာပါသည် (m3u8 မရရှိဘဲ)', false);
            }
        }
    } catch(e) {
        console.error('showMatch error:', e);
    }
}

// Auto refresh every 60s
setInterval(loadMatches, 60000);
loadMatches();
</script>
</body>
</html>
