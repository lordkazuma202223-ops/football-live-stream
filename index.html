<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ ဘစ်ကြီး - ဘောလုံးတိုက်ရိုက်ကြည့်</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

        .header{background:linear-gradient(135deg,#0f0f1a,#1a1a2e);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e94560;position:sticky;top:0;z-index:100}
        .header-left{display:flex;align-items:center;gap:10px}
        .brand{font-size:20px;font-weight:900;background:linear-gradient(90deg,#e94560,#ff6b6b,#ffa500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
        .brand-icon{font-size:22px}
        .no-ads{background:#28a745;color:#fff;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:bold;display:flex;align-items:center;gap:4px}
        .live-badge{background:#e94560;color:#fff;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:bold;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .header-btns{display:flex;gap:8px;align-items:center}
        .refresh-btn{background:rgba(255,255,255,.08);color:#aaa;border:1px solid rgba(255,255,255,.15);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:.2s}
        .refresh-btn:hover{background:rgba(255,255,255,.15);color:#fff}

        .container{max-width:1100px;margin:0 auto;padding:14px}

        /* Player */
        .player-box{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(233,69,96,.1);margin-bottom:14px}
        .player-box video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
        .player-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111;color:#444;z-index:5}
        .player-loading{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:10}
        .player-loading.active{display:flex}
        .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .quality-btns{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:6px}
        .q-btn{background:rgba(0,0,0,.7);color:#ccc;border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;transition:.2s}
        .q-btn:hover,.q-btn.active{background:#e94560;color:#fff;border-color:#e94560}

        /* Hidden iframe trap */
        .iframe-trap{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}

        /* Match Info */
        .match-info{background:linear-gradient(135deg,#0f0f1a,#1a1a2e);border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid rgba(233,69,96,.15);display:none}
        .match-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
        .league-info{display:flex;align-items:center;gap:8px;font-size:11px;color:#666}
        .league-info img{width:20px;height:20px;border-radius:3px}
        .status{font-size:10px;padding:3px 8px;border-radius:16px;font-weight:600}
        .st-live{background:rgba(233,69,96,.2);color:#e94560}
        .st-up{background:rgba(52,152,219,.2);color:#3498db}
        .st-ft{background:rgba(149,165,166,.2);color:#95a5a6}
        .teams-row{display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 0}
        .team{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:90px}
        .team img{width:40px;height:40px}
        .team-name{font-size:12px;font-weight:600;text-align:center}
        .score{font-size:24px;font-weight:900;color:#e94560;min-width:60px;text-align:center}
        .venue{font-size:10px;color:#555;text-align:center}

        /* Match List */
        .section-title{font-size:12px;color:#888;margin-bottom:8px;padding:0 4px;display:flex;align-items:center;gap:6px}
        .match-list{display:flex;flex-direction:column;gap:8px}
        .match-card{background:linear-gradient(135deg,#0f0f1a,#1a1a2e);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;cursor:pointer;transition:.2s}
        .match-card:hover{border-color:rgba(233,69,96,.4);transform:translateY(-1px)}
        .match-card.active{border-color:#e94560;background:linear-gradient(135deg,#1a0a15,#2a1a2e)}
        .card-teams{display:flex;align-items:center;justify-content:space-between}
        .card-team{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;min-width:0;flex:1}
        .card-team img{width:24px;height:24px;flex-shrink:0}
        .card-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .card-score{font-size:14px;font-weight:800;color:#e94560;min-width:50px;text-align:center;flex-shrink:0}
        .card-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:#555}
        .loading{text-align:center;padding:20px;color:#555;font-size:12px}

        /* League Filter Tabs */
        .league-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 4px 10px;scrollbar-width:none;-ms-overflow-style:none}
        .league-tabs::-webkit-scrollbar{display:none}
        .league-tab{flex-shrink:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#999;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;transition:.2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
        .league-tab:hover{background:rgba(233,69,96,.15);color:#e94560;border-color:rgba(233,69,96,.3)}
        .league-tab.active{background:linear-gradient(135deg,#e94560,#c0392b);color:#fff;border-color:#e94560}
        .league-tab img{width:16px;height:16px;border-radius:2px}
        .league-tab .count{background:rgba(0,0,0,.3);padding:1px 6px;border-radius:10px;font-size:9px;margin-left:2px}

        /* League Group Header */
        .league-group{margin-bottom:14px}
        .league-group-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.2s;border:1px solid transparent}
        .league-group-header:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
        .league-group-header img{width:20px;height:20px;border-radius:3px}
        .league-group-header .lg-name{font-size:12px;font-weight:700;color:#ddd;flex:1}
        .league-group-header .lg-country{font-size:10px;color:#666}
        .league-group-header .lg-count{font-size:10px;color:#e94560;font-weight:600}
        .league-group-header .lg-toggle{font-size:10px;color:#555;transition:.2s}
        .league-group-header .lg-toggle.collapsed{transform:rotate(-90deg)}
        .league-group-body{display:flex;flex-direction:column;gap:8px}
        .league-group-body.hidden{display:none}

        /* Stream status */
        .stream-status{position:absolute;bottom:10px;left:10px;z-index:20;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:4px;font-size:9px;display:none}
        .stream-status.ok{color:#28a745}
        .stream-status.warn{color:#ffc107}
        .stream-status.err{color:#dc3545}

        @media(max-width:600px){
            .header{padding:10px 14px}
            .brand{font-size:16px}
            .container{padding:10px}
            .card-team{font-size:11px}
            .card-score{font-size:12px;min-width:40px}
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <span class="brand-icon">⚽</span>
        <span class="brand">ဘစ်ကြီး</span>
        <span class="no-ads" id="ads-badge">🛡️ ကြော်ငြာမရှိ</span>
    </div>
    <div class="header-btns">
        <span class="live-badge">● တိုက်ရိုက်</span>
        <button class="refresh-btn" onclick="loadMatches()">🔄</button>
    </div>
</div>

<div class="container">
    <div class="player-box">
        <video id="video" controls playsinline></video>
        <div class="player-placeholder" id="placeholder">
            <div style="text-align:center">
                <div style="font-size:40px;margin-bottom:10px">⚽</div>
                <p style="font-size:13px">ပွဲစဉ်တစ်ခုခု ရွေးချယ်ပါ</p>
            </div>
        </div>
        <div class="player-loading" id="loading"><div class="spinner"></div></div>
        <div class="quality-btns" id="quality-btns" style="display:none">
            <button class="q-btn active" onclick="setQuality('hd')">HD</button>
            <button class="q-btn" onclick="setQuality('sd')">SD</button>
        </div>
        <div class="stream-status" id="stream-status"></div>
    </div>

    <!-- Hidden iframe for m3u8 interception -->
    <div class="iframe-trap" id="iframe-trap"></div>

    <div class="match-info" id="info">
        <div class="match-header">
            <div class="league-info" id="i-league"></div>
            <span class="status st-live" id="i-status"></span>
        </div>
        <div class="teams-row">
            <div class="team"><img id="i-h-badge"><span class="team-name" id="i-h-name"></span></div>
            <div class="score" id="i-score"></div>
            <div class="team"><img id="i-a-badge"><span class="team-name" id="i-a-name"></span></div>
        </div>
        <div class="venue" id="i-venue"></div>
    </div>

    <div class="section-title">📋 ယနေ့ ပွဲစဉ်များ</div>
    <div class="league-tabs" id="league-tabs"></div>
    <div class="match-list" id="match-list"></div>
</div>

<script>
const API_PROXY = '/api/matches';
const video = document.getElementById('video');
const iframeTrap = document.getElementById('iframe-trap');
let hls = null;
let currentStreams = null;
let currentQuality = 'hd';
let activeMatchId = null;
let interceptorActive = false;
let foundM3u8 = null;

// Status translations
const statusMap = {
    'inprogress': 'ကစားနေသည်',
    'finished': 'ပြီးဆုံး',
    'upcoming': 'မကစားရသေး',
    '1st half': 'ပထမပိုင်း',
    '2nd half': 'ဒုတိယပိုင်း',
    'halftime': 'အနားယူနေသည်',
    'LIVE': 'တိုက်ရိုက်',
    'FT': 'ပြီးဆုံး',
};

function getStatus(status, detail) {
    if (detail && statusMap[detail]) return statusMap[detail];
    if (statusMap[status]) return statusMap[status];
    return detail || status;
}

// === API ===
async function api(params) {
    const r = await fetch(API_PROXY + '?' + new URLSearchParams(params));
    return r.json();
}

// === Player ===
function playStream(url) {
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('loading').classList.add('active');

    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, startLevel: -1 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    if (currentQuality === 'hd' && currentStreams && currentStreams.sd && currentStreams.sd.length) {
                        setQuality('sd');
                    } else {
                        hls.startLoad();
                    }
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
        }, {once: true});
    }
}

function setQuality(q) {
    currentQuality = q;
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (currentStreams && currentStreams[q] && currentStreams[q].length) {
        playStream(currentStreams[q][0]);
    }
}

// === Block popups from iframes ===
const realWindowOpen = window.open;
window.open = function() { return null; }; // Block all popup windows

// === M3U8 Interceptor via Performance API ===
function startM3u8Interceptor(timeout = 15000) {
    return new Promise((resolve) => {
        foundM3u8 = null;
        interceptorActive = true;

        // Clear old resource entries
        performance.clearResourceTimings();

        const observer = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
                if (entry.name.includes('.m3u8') && !foundM3u8) {
                    foundM3u8 = entry.name;
                    observer.disconnect();
                    interceptorActive = false;
                    resolve(foundM3u8);
                }
            }
        });
        observer.observe({ entryTypes: ['resource'] });

        // Timeout fallback
        setTimeout(() => {
            if (!foundM3u8) {
                const resources = performance.getEntriesByType('resource');
                for (const r of resources) {
                    if (r.name.includes('.m3u8')) {
                        foundM3u8 = r.name;
                        break;
                    }
                }
            }
            observer.disconnect();
            interceptorActive = false;
            resolve(foundM3u8);
        }, timeout);
    });
}

function killIframe() {
    iframeTrap.innerHTML = '';
    // Also clear any leftover iframes in placeholder
    const ph = document.getElementById('placeholder');
    if (ph) {
        const iframes = ph.querySelectorAll('iframe');
        iframes.forEach(f => f.remove());
    }
}

// === Stream Loading ===
async function loadStreamAdFree(embedUrl) {
    showStatus('🔍 m3u8 ရှာဖွေနေသည်...', 'warn');
    
    // Start interceptor
    const m3u8Promise = startM3u8Interceptor(20000);

    // Load iframe into hidden trap - NO sandbox (breaks m3u8 detection)
    // Instead we block window.open and kill iframe ASAP
    iframeTrap.innerHTML = `<iframe src="${embedUrl}" width="1" height="1" frameborder="0" allow="encrypted-media" allowfullscreen></iframe>`;

    // Wait for m3u8 to be intercepted
    const m3u8 = await m3u8Promise;

    // Kill the iframe immediately to stop ads from loading further
    killIframe();

    if (m3u8) {
        // Success! Play ad-free
        const sdM3u8 = m3u8.replace('_lhd', '_lsd');
        currentStreams = { hd: [m3u8], sd: [sdM3u8 !== m3u8 ? sdM3u8 : ''] };
        document.getElementById('quality-btns').style.display = 'flex';
        currentQuality = 'hd';
        
        // Clear placeholder completely and hide it
        const ph = document.getElementById('placeholder');
        ph.innerHTML = '';
        ph.style.display = 'none';
        
        playStream(m3u8);
        showStatus('✅ Ad-Free Stream', 'ok');
        updateBadge(true);
        return true;
    } else {
        killIframe();
        return false;
    }
}

function showStatus(text, type) {
    const el = document.getElementById('stream-status');
    el.textContent = text;
    el.style.display = 'block';
    el.className = 'stream-status ' + (type || '');
    setTimeout(() => { el.style.display = 'none'; }, 8000);
}

function updateBadge(adFree) {
    const badge = document.getElementById('ads-badge');
    if (adFree) {
        badge.textContent = '🛡️ ကြော်ငြာမရှိ';
        badge.style.background = '#28a745';
    } else {
        badge.textContent = '⚠️ ကြော်ငြာပါ';
        badge.style.background = '#dc3545';
    }
}

// === Matches ===
let allLeagues = [];
let activeLeague = 'all';

async function loadMatches() {
    const el = document.getElementById('match-list');
    el.innerHTML = '<div class="loading"><div class="spinner" style="margin:0 auto 8px"></div>ရှာဖွေနေသည်...</div>';
    try {
        const today = new Date().toISOString().split('T')[0];
        const [live, upcoming] = await Promise.all([
            api({type:'matches', sport:'football', status:'inprogress'}),
            api({type:'matches', sport:'football', status:'upcoming', date:today})
        ]);
        const raw = [];
        if (live.success && Array.isArray(live.data)) raw.push(...live.data);
        if (upcoming.success && Array.isArray(upcoming.data)) raw.push(...upcoming.data);

        if (!raw.length) {
            el.innerHTML = '<div class="loading">ပွဲစဉ်မတွေ့ရှိပါ</div>';
            document.getElementById('league-tabs').innerHTML = '';
            return;
        }

        // Merge all leagues (deduplicate by name+country)
        allLeagues = [];
        const seen = new Set();
        for (const lg of raw) {
            const key = lg.league.name + '|' + lg.league.country;
            if (seen.has(key)) {
                // Merge matches into existing league
                const existing = allLeagues.find(l => l.key === key);
                if (existing) existing.matches.push(...lg.matches);
            } else {
                seen.add(key);
                allLeagues.push({
                    key,
                    league: lg.league,
                    matches: [...lg.matches]
                });
            }
        }

        // Sort leagues: live matches first, then by name
        allLeagues.sort((a, b) => {
            const aLive = a.matches.some(m => m.status === 'inprogress') ? 0 : 1;
            const bLive = b.matches.some(m => m.status === 'inprogress') ? 0 : 1;
            if (aLive !== bLive) return aLive - bLive;
            return a.league.name.localeCompare(b.league.name);
        });

        renderLeagueTabs();
        renderMatchList();

        // Auto-load first live match
        if (!activeMatchId) {
            for (const lg of allLeagues) {
                const live = lg.matches.find(m => m.status === 'inprogress');
                if (live) { showMatch(live.id); break; }
            }
        }
    } catch(e) {
        el.innerHTML = `<div class="loading">❌ ${e.message}</div>`;
    }
}

function renderLeagueTabs() {
    const tabs = document.getElementById('league-tabs');
    let html = `<div class="league-tab ${activeLeague === 'all' ? 'active' : ''}" onclick="filterLeague('all')">⚽ အားလုံး <span class="count">${allLeagues.reduce((s,l) => s + l.matches.length, 0)}</span></div>`;
    for (const lg of allLeagues) {
        const liveCount = lg.matches.filter(m => m.status === 'inprogress').length;
        const badge = liveCount > 0 ? '🔴' : '';
        html += `<div class="league-tab ${activeLeague === lg.key ? 'active' : ''}" onclick="filterLeague('${lg.key.replace(/'/g, "\\'")}')">
            <img src="${lg.league.flag || lg.league.logo}">
            ${badge} ${lg.league.name}
            <span class="count">${lg.matches.length}</span>
        </div>`;
    }
    tabs.innerHTML = html;
}

function filterLeague(key) {
    activeLeague = key;
    renderLeagueTabs();
    renderMatchList();
}

function renderMatchList() {
    const el = document.getElementById('match-list');
    const filtered = activeLeague === 'all' ? allLeagues : allLeagues.filter(l => l.key === activeLeague);
    let html = '';

    for (const lg of filtered) {
        const hasLive = lg.matches.some(m => m.status === 'inprogress');
        const leagueId = lg.key.replace(/[^a-zA-Z0-9]/g, '_');

        // League group header (only show when "all" is selected)
        if (activeLeague === 'all') {
            html += `<div class="league-group">
                <div class="league-group-header" onclick="toggleLeague('${leagueId}')">
                    <img src="${lg.league.flag || lg.league.logo}">
                    <span class="lg-name">${lg.league.name}</span>
                    <span class="lg-country">${lg.league.country}</span>
                    ${hasLive ? '<span class="lg-count">● LIVE</span>' : ''}
                    <span class="lg-count">${lg.matches.length} ပွဲ</span>
                    <span class="lg-toggle" id="toggle-${leagueId}">▼</span>
                </div>
                <div class="league-group-body" id="body-${leagueId}">`;
        } else {
            html += `<div class="league-group"><div class="league-group-body">`;
        }

        for (const m of lg.matches) {
            const sc = m.status === 'inprogress' ? 'st-live' : m.status === 'finished' ? 'st-ft' : 'st-up';
            const st = getStatus(m.status, m.status_detail);
            html += `<div class="match-card${m.id === activeMatchId ? ' active' : ''}" onclick="showMatch('${m.id}')">
                <div class="card-teams">
                    <div class="card-team"><img src="${m.teams.home.badge}"><span>${m.teams.home.name}</span></div>
                    <div class="card-score">${m.score.display||'VS'}</div>
                    <div class="card-team" style="flex-direction:row-reverse"><img src="${m.teams.away.badge}"><span>${m.teams.away.name}</span></div>
                </div>
                <div class="card-meta">
                    <span>${lg.league.name} • ${lg.league.country}</span>
                    <span class="status ${sc}" style="font-size:9px">${st}</span>
                </div>
            </div>`;
        }

        html += '</div></div>';
    }

    el.innerHTML = html || '<div class="loading">ပွဲစဉ်မတွေ့ရှိပါ</div>';
}

function toggleLeague(id) {
    const body = document.getElementById('body-' + id);
    const toggle = document.getElementById('toggle-' + id);
    if (body && toggle) {
        body.classList.toggle('hidden');
        toggle.classList.toggle('collapsed');
    }
}

function stopCurrentStream() {
    // Destroy HLS player immediately
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();

    // Kill any hidden iframe trap
    killIframe();

    // Clear placeholder
    const ph = document.getElementById('placeholder');
    ph.innerHTML = '<div style="text-align:center"><div style="font-size:40px;margin-bottom:10px">⚽</div><p style="font-size:13px;color:#555">ခဏစောင့်ပါ...</p></div>';
    ph.style.display = 'flex';

    // Show loading spinner
    document.getElementById('loading').classList.add('active');

    // Reset quality & streams
    currentStreams = null;
    currentQuality = 'hd';
    document.getElementById('quality-btns').style.display = 'none';
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.q-btn')?.classList.add('active');
}

async function showMatch(id) {
    // Immediately stop previous stream
    stopCurrentStream();

    activeMatchId = id;
    document.querySelectorAll('.match-card').forEach(c => c.classList.remove('active'));

    try {
        const detail = await api({type:'detail', id});
        if (!detail.success) return;
        const m = detail.data.match_info;
        const info = document.getElementById('info');

        document.getElementById('i-league').innerHTML = `<img src="${m.league.flag}"><span>${m.league.name} • ${m.league.country}</span>`;
        document.getElementById('i-status').textContent = getStatus(m.status, m.status_detail);
        document.getElementById('i-h-badge').src = m.teams.home.badge;
        document.getElementById('i-h-name').textContent = m.teams.home.name;
        document.getElementById('i-a-badge').src = m.teams.away.badge;
        document.getElementById('i-a-name').textContent = m.teams.away.name;
        document.getElementById('i-score').textContent = m.score.display;

        const v = detail.data.info?.venue;
        document.getElementById('i-venue').textContent = v ? `${v.stadium} • ${v.city}` : '';
        info.style.display = 'block';

        // Get embed URL from API sources
        const sources = detail.data.sources || [];
        
        // Try streamapi.cc source first (echo) - it has the m3u8 we can intercept
        const streamapiSource = sources.find(s => s.embedUrl && s.embedUrl.includes('streamapi.cc'));
        const sport99Source = sources.find(s => s.embedUrl && s.embedUrl.includes('sport99.live'));

        if (streamapiSource) {
            // Try to intercept m3u8 via Performance API trick
            showStatus('🔍 Ad-Free stream ရှာနေသည်...', 'warn');
            const success = await loadStreamAdFree(streamapiSource.embedUrl);
            
            if (success) return;
        }

        // Fallback: try sport99.live source  
        if (sport99Source) {
            showStatus('🔍 ဒုတိယနည်းလမ်း စမ်းသပ်နေ...', 'warn');
            const success = await loadStreamAdFree(sport99Source.embedUrl);
            
            if (success) return;
        }

        // Final fallback: show iframe with ads
        if (sources.length) {
            currentStreams = null;
            document.getElementById('quality-btns').style.display = 'none';
            document.getElementById('placeholder').innerHTML = `<iframe src="${sources[0].embedUrl}" width="100%" height="100%" frameborder="0" scrolling="no" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe>`;
            document.getElementById('placeholder').style.display = 'block';
            showStatus('⚠️ m3u8 မရဘဲ iframe သုံးရသည် (ကြော်ငြာပါ)', 'err');
            updateBadge(false);
        }
    } catch(e) {
        console.error('showMatch error:', e);
    }
}

// Auto refresh every 60s
setInterval(loadMatches, 60000);
loadMatches();
</script>
