<!DOCTYPE html>
<html lang="my">
<head>

    <link rel="stylesheet" href="webmeji/webmeji.css">
</head>
<body>

<header class="header">
    <div class="header-left">
        <a class="brand" href="index.html">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 8 3 2.2-1.1 3.4h-3.8L9 10.2 12 8Z"/><path d="M12 3v3.1M4.9 9.9l3.2-.1M19.1 9.9l-3.2-.1M7.7 18.3l1.8-2.6M16.3 18.3l-1.8-2.6"/></svg></span>
            <span class="brand-name">ဘစ်ကြီး</span>
        </a>
        <nav class="nav">
            <a class="nav-link active" href="index.html">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/><path d="m12 7 3 2-1 3h-4L9 9l3-2Z"/></svg>
                <span>ပွဲစဉ်များ</span>
            </a>
            <a class="nav-link" href="iptv.html">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/></svg>
                <span>တီဗီ</span>
            </a>
            <a class="nav-link" href="users.html">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>အသုံးပြုသူများ</span>
            </a>
        </nav>
    </div>
    <div class="header-right">
        <span class="live-badge"><span class="live-dot"></span><span class="lbl">တိုက်ရိုက်</span></span>
        <button class="btn btn-icon" onclick="forceRefresh()" title="ပြန်လည်ရယူ" aria-label="refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <h1 class="page-title"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="12" r="9"/><path d="m12 8 3 2.2-1.1 3.4h-3.8L9 10.2 12 8Z"/></svg>ယနေ့ ဘောလုံးပွဲစဉ်များ</h1>
        <p class="page-sub">တိုက်ရိုက်နှင့် လာမည့်ပွဲစဉ်များကို အချိန်နှင့်တပြေးညီ ကြည့်ရှုပါ</p>
    </div>

    <div class="toolbar">
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" class="search-input" id="search-input" placeholder="အသင်းအမည် / လိဂ် ရှာဖွေရန်..." oninput="onSearch()" autocomplete="off">
            <button class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="status-tabs" id="status-tabs"></div>
        <div class="chip-row" id="league-tabs"></div>
    </div>

    <div class="match-list" id="match-list"></div>
</main>

<footer class="footer">
    <span>© 2026 ဘစ်ကြီး — ဘောလုံး တိုက်ရိုက်ကြည့်ရန်</span>
    <span>ဆက်သွယ်ရန် <a href="https://t.me/yourchannel" target="_blank" rel="noopener">Telegram</a></span>
</footer>

<script>
const API_PROXY = '/api/matches';
let forceCacheBust = false;

const ICON = {
    ball: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 8 3 2.2-1.1 3.4h-3.8L9 10.2 12 8Z"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>',
    live: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 17 4H7a2 2 0 0 0-1.5 1.5z"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'
};

const statusMap = {
    'inprogress': 'ကစားနေသည်',
    'finished': 'ပြီးဆုံး',
    'upcoming': 'မကစားရသေး',
    '1st half': 'ပထမပိုင်း',
    '2nd half': 'ဒုတိယပိုင်း',
    'halftime': 'အနားယူနေသည်',
    'LIVE': 'တိုက်ရိုက်',
    'FT': 'ပြီးဆုံး',
};

function getStatus(status, detail) {
    if (detail && statusMap[detail]) return statusMap[detail];
    if (statusMap[status]) return statusMap[status];
    return detail || status;
}

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// === API ===
async function api(params) {
    if (forceCacheBust) params._t = Date.now();
    const r = await fetch(API_PROXY + '?' + new URLSearchParams(params));
    forceCacheBust = false;
    if (!r.ok) throw new Error('ဆာဗာမှာ ပြဿနာရှိနေသည် (' + r.status + ')');
    const text = await r.text();
    if (!text || !text.trim()) throw new Error('API မှ ဒေတာမရရှိပါ။ ခဏငြား ပြန်စမ်းကြည့်ပါ။');
    try { return JSON.parse(text); }
    catch (e) { throw new Error('API မှ မမှန်ကန်သော ဒေတာ ရရှိနေသည်။'); }
}

// === Match open ===
function showMatch(id) {
    window.location.href = 'player.html?id=' + encodeURIComponent(id);
}

// === Matches ===
let allLeagues = [];
let activeLeague = 'all';
let activeStatus = 'all';
let searchQuery = '';

function forceRefresh() {
    forceCacheBust = true;
    loadMatches();
}

async function loadMatches() {
    const el = document.getElementById('match-list');
    el.innerHTML = '<div class="loading"><div class="spinner"></div><span>ရှာဖွေနေသည်...</span></div>';
    try {
        const [allResp, liveResp] = await Promise.all([
            api({ type: 'matches', sport: 'football' }),
            api({ type: 'matches', sport: 'football', status: 'inprogress' })
        ]);
        const raw = [];
        if (allResp.success && Array.isArray(allResp.data)) raw.push(...allResp.data);
        if (liveResp.success && Array.isArray(liveResp.data)) {
            const liveKeys = new Set();
            for (const lg of liveResp.data) for (const m of lg.matches) liveKeys.add(m.id);
            for (const lg of raw) lg.matches = lg.matches.filter(m => !liveKeys.has(m.id));
            raw.push(...liveResp.data);
        }
        if (!raw.length) {
            el.innerHTML = '<div class="state"><div class="state-icon">' + ICON.inbox + '</div><div class="state-title">ပွဲစဉ် မတွေ့ရှိပါ</div></div>';
            document.getElementById('league-tabs').innerHTML = '';
            document.getElementById('status-tabs').innerHTML = '';
            return;
        }
        allLeagues = [];
        const seen = new Set();
        for (const lg of raw) {
            const key = lg.league.name + '|' + lg.league.country;
            if (seen.has(key)) {
                const existing = allLeagues.find(l => l.key === key);
                if (existing) existing.matches.push(...lg.matches);
            } else {
                seen.add(key);
                allLeagues.push({ key, league: lg.league, matches: [...lg.matches] });
            }
        }
        allLeagues.sort((a, b) => {
            const aLive = a.matches.some(m => m.status === 'inprogress') ? 0 : 1;
            const bLive = b.matches.some(m => m.status === 'inprogress') ? 0 : 1;
            if (aLive !== bLive) return aLive - bLive;
            return a.league.name.localeCompare(b.league.name);
        });
        renderStatusTabs();
        renderLeagueTabs();
        renderMatchList();
    } catch (e) {
        el.innerHTML = '<div class="state"><div class="state-icon" style="color:var(--live)">' + ICON.warn + '</div><div class="state-title" style="color:var(--live)">ဒေတာ ရယူ၍ မရပါ</div><div class="state-msg">' + esc(e.message || 'အမည်မသိ အမှားပြ') + '</div><button class="btn btn-primary" onclick="loadMatches()">' + ICON.refresh + ' ပြန်စမ်းကြည့်ပါ</button></div>';
        document.getElementById('league-tabs').innerHTML = '';
        document.getElementById('status-tabs').innerHTML = '';
    }
}

function onSearch() {
    const input = document.getElementById('search-input');
    const clear = document.getElementById('search-clear');
    searchQuery = input.value.trim().toLowerCase();
    clear.classList.toggle('show', searchQuery.length > 0);
    renderLeagueTabs();
    renderMatchList();
}

function clearSearch() {
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').classList.remove('show');
    searchQuery = '';
    renderLeagueTabs();
    renderMatchList();
}

function setStatusFilter(status) {
    activeStatus = status;
    renderStatusTabs();
    renderLeagueTabs();
    renderMatchList();
}

function renderStatusTabs() {
    const el = document.getElementById('status-tabs');
    const allCount = allLeagues.reduce((s, l) => s + l.matches.length, 0);
    const liveCount = allLeagues.reduce((s, l) => s + l.matches.filter(m => m.status === 'inprogress').length, 0);
    const upcomingCount = allLeagues.reduce((s, l) => s + l.matches.filter(m => m.status !== 'inprogress' && m.status !== 'finished').length, 0);
    el.innerHTML =
        '<div class="status-tab ' + (activeStatus === 'all' ? 'active-all' : '') + '" onclick="setStatusFilter(\'all\')">' + ICON.list + '<span class="lbl">အားလုံး</span><span class="badge">' + allCount + '</span></div>' +
        '<div class="status-tab ' + (activeStatus === 'live' ? 'active-live' : '') + '" onclick="setStatusFilter(\'live\')">' + ICON.live + '<span class="lbl">ကစားနေ</span><span class="badge">' + liveCount + '</span></div>' +
        '<div class="status-tab ' + (activeStatus === 'upcoming' ? 'active-upcoming' : '') + '" onclick="setStatusFilter(\'upcoming\')">' + ICON.clock + '<span class="lbl">မကစားရသေး</span><span class="badge">' + upcomingCount + '</span></div>';
}

function filterByStatus(matches) {
    if (activeStatus === 'live') return matches.filter(m => m.status === 'inprogress');
    if (activeStatus === 'upcoming') return matches.filter(m => m.status !== 'inprogress' && m.status !== 'finished');
    return matches;
}

function filterBySearch(matches) {
    if (!searchQuery) return matches;
    return matches.filter(m => (m.teams.home.name || '').toLowerCase().includes(searchQuery) || (m.teams.away.name || '').toLowerCase().includes(searchQuery));
}

function renderLeagueTabs() {
    const tabs = document.getElementById('league-tabs');
    let totalFiltered = 0;
    for (const lg of allLeagues) {
        let m = filterBySearch(filterByStatus(lg.matches));
        lg._filteredCount = m.length;
        totalFiltered += m.length;
    }
    let html = '<button class="chip ' + (activeLeague === 'all' ? 'active' : '') + '" onclick="filterLeague(\'all\')">' + ICON.ball + ' အားလုံး <span class="count">' + totalFiltered + '</span></button>';
    for (const lg of allLeagues) {
        if (lg._filteredCount === 0) continue;
        const liveCount = lg.matches.filter(m => m.status === 'inprogress').length;
        html += '<button class="chip ' + (activeLeague === lg.key ? 'active' : '') + '" onclick="filterLeague(\'' + esc(lg.key).replace(/'/g, "\\'") + '\')"><img src="' + esc(lg.league.flag || lg.league.logo) + '" alt="" onerror="this.style.display=\'none\'">' + (liveCount > 0 ? '<span class="live-mini"></span>' : '') + esc(lg.league.name) + ' <span class="count">' + lg._filteredCount + '</span></button>';
    }
    tabs.innerHTML = html;
}

function filterLeague(key) {
    activeLeague = key;
    renderLeagueTabs();
    renderMatchList();
}

function renderMatchList() {
    const el = document.getElementById('match-list');
    const filtered = activeLeague === 'all' ? allLeagues : allLeagues.filter(l => l.key === activeLeague);
    let html = '';
    for (const lg of filtered) {
        let matches = filterBySearch(filterByStatus(lg.matches));
        if (!matches.length) continue;
        const hasLive = matches.some(m => m.status === 'inprogress');
        const leagueId = lg.key.replace(/[^a-zA-Z0-9]/g, '_');
        if (activeLeague === 'all') {
            html += '<div class="league-group"><div class="league-group-header" onclick="toggleLeague(\'' + leagueId + '\')">' +
                '<img src="' + esc(lg.league.flag || lg.league.logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
                '<span class="lg-name">' + esc(lg.league.name) + '</span>' +
                '<span class="lg-country">' + esc(lg.league.country) + '</span>' +
                '<span class="lg-spacer"></span>' +
                (hasLive ? '<span class="lg-count live"><span class="live-mini"></span>LIVE</span>' : '') +
                '<span class="lg-count">' + matches.length + ' ပွဲ</span>' +
                '<span class="lg-toggle" id="toggle-' + leagueId + '">' + ICON.chevron + '</span></div><div class="league-group-body" id="body-' + leagueId + '">';
        } else {
            html += '<div class="league-group"><div class="league-group-body">';
        }
        let ci = 0;
        for (const m of matches) {
            const sc = m.status === 'inprogress' ? 'st-live' : m.status === 'finished' ? 'st-ft' : 'st-up';
            const st = getStatus(m.status, m.status_detail);
            const delay = Math.min(ci++ * 30, 300);
            html += '<div class="match-card" style="--d:' + delay + 'ms" onclick="showMatch(\'' + esc(m.id) + '\')">' +
                '<div class="card-teams">' +
                '<div class="card-team"><img src="' + esc(m.teams.home.badge) + '" alt="" onerror="this.style.visibility=\'hidden\'"><span>' + esc(m.teams.home.name) + '</span></div>' +
                '<div class="card-score">' + esc(m.score.display || 'VS') + '</div>' +
                '<div class="card-team away"><img src="' + esc(m.teams.away.badge) + '" alt="" onerror="this.style.visibility=\'hidden\'"><span>' + esc(m.teams.away.name) + '</span></div>' +
                '</div>' +
                '<div class="card-meta"><span class="lg-txt">' + esc(lg.league.name) + ' • ' + esc(lg.league.country) + '</span><span class="status ' + sc + '">' + esc(st) + '</span></div>' +
                '</div>';
        }
        html += '</div></div>';
    }
    el.innerHTML = html || '<div class="state"><div class="state-icon">' + ICON.search + '</div><div class="state-title">' + (searchQuery ? 'ရှာဖွေတာ တွေ့ရှိမှုမရှိပါ' : 'ပွဲစဉ်မတွေ့ရှိပါ') + '</div></div>';
}

function toggleLeague(id) {
    const body = document.getElementById('body-' + id);
    const toggle = document.getElementById('toggle-' + id);
    if (body && toggle) {
        body.classList.toggle('hidden');
        toggle.classList.toggle('collapsed');
    }
}

setInterval(loadMatches, 60000);
loadMatches();
</script>
<script src="config.js"></script>
<script src="visitors.js"></script>
<script src="webmeji/config.js"></script>
<script src="webmeji/webmeji.js"></script>
<script src="webmeji/webmeji-init.js"></script>
</body>
