<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d13">
    <title>တီဗီ — ဘစ်ကြီး</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<header class="header">
    <div class="header-left">
        <a class="brand" href="index.html">
            <span class="brand-mark">⚽</span>
            <span class="brand-name">ဘစ်ကြီး</span>
        </a>
        <nav class="nav">
            <a class="nav-link" href="index.html">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/><path d="m12 7 3 2-1 3h-4L9 9l3-2Z"/></svg>
                <span>ပွဲစဉ်များ</span>
            </a>
            <a class="nav-link active" href="iptv.html">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/></svg>
                <span>တီဗီ</span>
            </a>
        </nav>
    </div>
    <div class="header-right">
        <button class="btn btn-icon" onclick="loadChannels(true)" title="ပြန်လည်ရယူ" aria-label="refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <h1 class="page-title">📺 မြန်မာ တီဗီ ချန်နယ်များ</h1>
        <p class="page-sub" id="iptv-sub">အခမဲ့ ထုတ်လွှင့်နေသော ချန်နယ်များကို တိုက်ရိုက် ကြည့်ရှုပါ</p>
    </div>

    <div class="toolbar">
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" class="search-input" id="search-input" placeholder="ချန်နယ် ရှာဖွေရန်..." oninput="onSearch()" autocomplete="off">
            <button class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="clear">✕</button>
        </div>
        <div class="chip-row" id="group-tabs"></div>
    </div>

    <div class="channel-grid" id="channel-grid">
        <div class="loading" style="grid-column:1/-1"><div class="spinner"></div><span>ချန်နယ်များ ရယူနေသည်...</span></div>
    </div>
</main>

<footer class="footer">
    <span>© 2026 ဘစ်ကြီး — မြန်မာ IPTV</span>
    <span>အချက်အလက် <a href="https://github.com/iptv-org/iptv" target="_blank" rel="noopener">iptv-org</a> မှ</span>
</footer>

<!-- IPTV player modal -->
<div class="overlay" id="player-overlay">
    <div class="modal iptv-modal">
        <button class="modal-close" onclick="closePlayer()" aria-label="close">✕</button>
        <div class="player-box">
            <video id="iptv-video" controls playsinline autoplay></video>
            <div class="player-loading active" id="iptv-loading"><div class="spinner lg"></div><span id="iptv-loading-txt">ချိတ်ဆက်နေသည်...</span></div>
            <div class="stream-status" id="iptv-status"></div>
        </div>
        <div class="iptv-modal-head">
            <img class="ct-logo" id="iptv-logo" alt="" onerror="this.style.visibility='hidden'">
            <div>
                <div class="ct-name" id="iptv-name"></div>
                <div class="ct-group" id="iptv-group"></div>
            </div>
        </div>
    </div>
</div>

<script>
const IPTV_API = '/api/iptv';
const FALLBACK_M3U = 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/mm.m3u';
let allChannels = [];
let groups = [];
let activeGroup = 'all';
let searchQuery = '';
let hls = null;

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseM3U(text) {
    const lines = String(text).split(/\r?\n/);
    const out = [];
    let cur = null;
    for (const raw of lines) {
        const line = raw.trim();
        if (!line || (line.startsWith('#') && !line.startsWith('#EXTINF'))) continue;
        if (line.startsWith('#EXTINF')) {
            cur = {
                name: (line.split(',').pop() || '').trim() || 'Channel',
                logo: (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '',
                group: (line.match(/group-title="([^"]*)"/) || [])[1] || 'General',
                id: (line.match(/tvg-id="([^"]*)"/) || [])[1] || '',
            };
        } else if (cur) {
            cur.url = line;
            out.push(cur);
            cur = null;
        }
    }
    return out.filter(c => c.url);
}

async function loadChannels(force) {
    const grid = document.getElementById('channel-grid');
    grid.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div><span>ချန်နယ်များ ရယူနေသည်...</span></div>';
    let data = null;
    try {
        const r = await fetch(IPTV_API + (force ? '?_t=' + Date.now() : ''));
        const j = await r.json();
        if (j && j.success && Array.isArray(j.channels)) data = j;
    } catch (e) {}

    if (!data) {
        // Fallback: fetch the raw playlist directly (raw.githubusercontent.com sends CORS headers)
        try {
            const r = await fetch(FALLBACK_M3U + (force ? '?_t=' + Date.now() : ''));
            const text = await r.text();
            const channels = parseM3U(text);
            if (channels.length) data = { success: true, channels, groups: [...new Set(channels.map(c => c.group))].sort() };
        } catch (e) {}
    }

    if (!data || !data.channels.length) {
        grid.innerHTML = '<div class="state" style="grid-column:1/-1"><div class="state-icon">📡</div><div class="state-title">ချန်နယ်များ ရယူ၍ မရပါ</div><div class="state-msg">ဆာဗာနှင့် ချိတ်ဆက်မှု ပြဿနာ သို့မဟုတ် playlist မရနိုင်ပါ။ ပြန်စမ်းကြည့်ပါ။</div><button class="btn btn-primary" onclick="loadChannels(true)">🔄 ပြန်စမ်းကြည့်ပါ</button></div>';
        return;
    }

    allChannels = data.channels;
    groups = data.groups && data.groups.length ? data.groups : [...new Set(allChannels.map(c => c.group))].sort();
    document.getElementById('iptv-sub').textContent = 'ချန်နယ် ' + allChannels.length + ' ခု • အခမဲ့ ထုတ်လွှင့်နေသည်';
    renderGroupTabs();
    renderGrid();
}

function onSearch() {
    const input = document.getElementById('search-input');
    const clear = document.getElementById('search-clear');
    searchQuery = input.value.trim().toLowerCase();
    clear.classList.toggle('show', searchQuery.length > 0);
    renderGrid();
}
function clearSearch() {
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').classList.remove('show');
    searchQuery = '';
    renderGrid();
}

function renderGroupTabs() {
    const el = document.getElementById('group-tabs');
    let html = '<button class="chip ' + (activeGroup === 'all' ? 'active' : '') + '" onclick="setGroup(\'all\')">📺 အားလုံး <span class="count">' + allChannels.length + '</span></button>';
    for (const g of groups) {
        const n = allChannels.filter(c => c.group === g).length;
        html += '<button class="chip ' + (activeGroup === g ? 'active' : '') + '" onclick="setGroup(\'' + esc(g).replace(/'/g, "\\'") + '\')">' + esc(g) + ' <span class="count">' + n + '</span></button>';
    }
    el.innerHTML = html;
}
function setGroup(g) { activeGroup = g; renderGroupTabs(); renderGrid(); }

function renderGrid() {
    const grid = document.getElementById('channel-grid');
    let list = allChannels;
    if (activeGroup !== 'all') list = list.filter(c => c.group === activeGroup);
    if (searchQuery) list = list.filter(c => (c.name || '').toLowerCase().includes(searchQuery));
    if (!list.length) {
        grid.innerHTML = '<div class="state" style="grid-column:1/-1"><div class="state-icon">🔍</div><div class="state-title">' + (searchQuery ? 'ရှာဖွေတာ တွေ့ရှိမှုမရှိပါ' : 'ချန်နယ် မတွေ့ရှိပါ') + '</div></div>';
        return;
    }
    grid.innerHTML = list.map((c, i) => {
        const logo = c.logo ? '<img src="' + esc(c.logo) + '" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'<span class=fallback>📺</span>\'">' : '<span class="fallback">📺</span>';
        return '<button class="channel-card" onclick="playChannel(' + allChannels.indexOf(c) + ')">' +
            '<span class="channel-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>' +
            '<span class="channel-logo">' + logo + '</span>' +
            '<span class="channel-name">' + esc(c.name) + '</span>' +
            '<span class="channel-group">' + esc(c.group) + '</span>' +
            '</button>';
    }).join('');
}

// === Player ===
function playChannel(idx) {
    const c = allChannels[idx];
    if (!c) return;
    document.getElementById('player-overlay').classList.add('active');
    document.getElementById('iptv-name').textContent = c.name;
    document.getElementById('iptv-group').textContent = c.group;
    const logoEl = document.getElementById('iptv-logo');
    logoEl.style.visibility = 'visible';
    logoEl.src = c.logo || '';
    loadStream(c);
}

function setLoadTxt(txt) {
    const l = document.getElementById('iptv-loading');
    document.getElementById('iptv-loading-txt').textContent = txt;
    l.classList.add('active');
}

function showIptvStatus(text, type) {
    const el = document.getElementById('iptv-status');
    el.textContent = text;
    el.style.display = 'block';
    el.className = 'stream-status ' + (type || '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 8000);
}

function loadStream(c) {
    const video = document.getElementById('iptv-video');
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
    setLoadTxt('ချိတ်ဆက်နေသည်...');

    const url = c.url;
    if (location.protocol === 'https:' && url.startsWith('http:')) {
        document.getElementById('iptv-loading').classList.remove('active');
        showIptvStatus('⚠️ HTTP stream — HTTPS စာမျက်နှာတွင် မဖွင့်နိုင်ပါ', 'err');
        return;
    }

    const done = () => document.getElementById('iptv-loading').classList.remove('active');

    if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, liveSyncDurationCount: 3, manifestLoadingTimeOut: 12000 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { done(); video.play().catch(() => {}); });
        hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); }
                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
                else {
                    hls.destroy(); hls = null;
                    done();
                    showIptvStatus('❌ Channel ဖွင့်၍ မရပါ (offline ဖြစ်နိုင်သည်)', 'err');
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => { done(); video.play().catch(() => {}); }, { once: true });
        video.addEventListener('error', () => { done(); showIptvStatus('❌ Channel ဖွင့်၍ မရပါ', 'err'); }, { once: true });
    } else {
        done();
        showIptvStatus('❌ ဤ browser သည် HLS မပံ့ပိုးပါ', 'err');
    }
}

function closePlayer() {
    document.getElementById('player-overlay').classList.remove('active');
    const video = document.getElementById('iptv-video');
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
}

document.getElementById('player-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'player-overlay') closePlayer();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayer(); });

loadChannels(false);
</script>
</body>
</html>
