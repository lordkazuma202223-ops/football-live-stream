<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d13">
    <title>ကြည့်ရှုနေသည် — ဘစ်ကြီး</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<header class="header">
    <div class="header-left">
        <a class="brand" href="index.html">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 8 3 2.2-1.1 3.4h-3.8L9 10.2 12 8Z"/><path d="M12 3v3.1M4.9 9.9l3.2-.1M19.1 9.9l-3.2-.1M7.7 18.3l1.8-2.6M16.3 18.3l-1.8-2.6"/></svg></span>
            <span class="brand-name">ဘစ်ကြီး</span>
        </a>
    </div>
    <div class="header-right">
        <span class="live-badge" id="ads-badge"><span class="live-dot" style="background:var(--accent)"></span><span class="lbl">ကြော်ငြာမရှိ</span></span>
        <a href="index.html" class="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            ပွဲစဉ်စာမျက်နှာ
        </a>
    </div>
</header>

<main class="container">
    <!-- Error state -->
    <div class="state" id="error-page" style="display:none">
        <div class="state-icon" style="color:var(--live)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>
        <div class="state-title" style="color:var(--live)">ပွဲစဉ် ဖွင့်၍ မရပါ</div>
        <div class="state-msg" id="error-msg">ပွဲစဉ်အချက်အလက် ရယူ၍ မရပါ။ ခဏငြား ပြန်စမ်းကြည့်ပါ။</div>
        <a href="index.html" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> ပွဲစဉ်စာမျက်နှာသို့</a>
    </div>

    <!-- Player -->
    <div id="player-section" style="display:none">
        <div class="player-box">
            <video id="video" controls playsinline></video>
            <div class="player-placeholder" id="placeholder">
                <div>
                    <div style="color:var(--muted-2);margin-bottom:12px;display:flex;justify-content:center"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 8 3 2.2-1.1 3.4h-3.8L9 10.2 12 8Z"/><path d="M12 3v3.1M4.9 9.9l3.2-.1M19.1 9.9l-3.2-.1M7.7 18.3l1.8-2.6M16.3 18.3l-1.8-2.6"/></svg></div>
                    <p style="font-size:13px">ခဏစောင့်ပါ...</p>
                </div>
            </div>
            <div class="player-loading" id="loading"><div class="spinner lg"></div><span>Stream ပြင်ဆင်နေသည်...</span></div>
            <div class="quality-btns" id="quality-btns" style="display:none"></div>
            <div class="stream-status" id="stream-status"></div>
        </div>

        <div class="match-info" id="info">
            <div class="match-header">
                <div class="league-info" id="i-league"></div>
                <span class="status st-live" id="i-status"></span>
            </div>
            <div class="teams-row">
                <div class="team"><img id="i-h-badge" alt=""><span class="team-name" id="i-h-name"></span></div>
                <div class="score" id="i-score"></div>
                <div class="team"><img id="i-a-badge" alt=""><span class="team-name" id="i-a-name"></span></div>
            </div>
            <div class="venue" id="i-venue"></div>
        </div>
    </div>
</main>

<footer class="footer">
    <span>© 2026 ဘစ်ကြီး — ဘောလုံး တိုက်ရိုက်ကြည့်ရန်</span>
</footer>

<script>
const API_PROXY = '/api/matches';
const video = document.getElementById('video');
let hls = null;
let currentStreams = [];
let currentIndex = 0;
let currentSourceUrl = null;
let allSources = [];
let resolveRetries = 0;

const statusMap = {
    'inprogress': 'ကစားနေသည်',
    'finished': 'ပြီးဆုံး',
    'upcoming': 'မကစားရသေး',
    '1st half': 'ပထမပိုင်း',
    '2nd half': 'ဒုတိယပိုင်း',
    'halftime': 'အနားယူနေသည်',
    'LIVE': 'တိုက်ရိုက်',
    'FT': 'ပြီးဆုံး',
};

function getStatus(status, detail) {
    if (detail && statusMap[detail]) return statusMap[detail];
    if (statusMap[status]) return statusMap[status];
    return detail || status;
}

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function goHome() { window.location.href = 'index.html'; }

async function api(params) {
    const r = await fetch(API_PROXY + '?' + new URLSearchParams(params));
    return r.json();
}

window.open = function () { return null; };

// === Ad-free playback (server resolves the stream, we play it directly) ===
async function resolveSource(embedUrl) {
    const r = await fetch('/api/resolve?url=' + encodeURIComponent(embedUrl));
    const data = await r.json().catch(() => null);
    return (data && data.success && Array.isArray(data.streams)) ? data.streams : [];
}

function playStream(url) {
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('loading').classList.add('active');
    video.style.display = 'block';
    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, startLevel: -1, liveDurationInfinity: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
            showStatus('ကြော်ငြာမပါသော Stream', 'ok');
            updateBadge(true);
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) refreshStream();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else playNextSource();
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            document.getElementById('loading').classList.remove('active');
            video.play().catch(() => {});
            updateBadge(true);
        }, { once: true });
        video.addEventListener('error', () => playNextSource(), { once: true });
    }
}

function playIndex(i) {
    if (!currentStreams[i]) return;
    currentIndex = i;
    document.querySelectorAll('#quality-btns .q-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    const st = currentStreams[i];
    playStream(st.hls || ('/api/hls?u=' + encodeURIComponent(st.url)));
}

function buildChannelButtons() {
    const qb = document.getElementById('quality-btns');
    qb.innerHTML = '';
    currentStreams.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = 'q-btn' + (i === 0 ? ' active' : '');
        b.textContent = s.name || ('Channel ' + (i + 1));
        b.addEventListener('click', () => { resolveRetries = 0; playIndex(i); });
        qb.appendChild(b);
    });
    qb.style.display = currentStreams.length > 1 ? 'flex' : 'none';
}

async function activateSource(embedUrl) {
    currentSourceUrl = embedUrl;
    showStatus('ကြော်ငြာမပါသော Stream ရှာနေသည်...', 'warn');
    document.getElementById('loading').classList.add('active');
    try {
        const streams = await resolveSource(embedUrl);
        if (streams.length) {
            currentStreams = streams;
            resolveRetries = 0;
            buildChannelButtons();
            playIndex(0);
            return true;
        }
    } catch (e) {}
    return false;
}

async function playNextSource() {
    if (hls) { hls.destroy(); hls = null; }
    const start = allSources.findIndex(s => s.embedUrl === currentSourceUrl);
    for (let i = start + 1; i < allSources.length && i <= start + 4; i++) {
        if (await activateSource(allSources[i].embedUrl)) return;
    }
    fallbackEmbed(allSources[0] && allSources[0].embedUrl);
}

async function refreshStream() {
    resolveRetries++;
    if (resolveRetries > 1) { playNextSource(); return; }
    showStatus('Stream ပြန်ချိတ်နေသည်...', 'warn');
    try {
        const streams = await resolveSource(currentSourceUrl);
        if (streams.length) {
            currentStreams = streams;
            resolveRetries = 0;
            buildChannelButtons();
            playIndex(Math.min(currentIndex, streams.length - 1));
            return;
        }
    } catch (e) {}
    playNextSource();
}

function fallbackEmbed(url) {
    if (!url) return;
    if (hls) { hls.destroy(); hls = null; }
    currentStreams = [];
    document.getElementById('quality-btns').style.display = 'none';
    document.getElementById('loading').classList.remove('active');
    video.style.display = 'none';
    const ph = document.getElementById('placeholder');
    ph.innerHTML = '<iframe src="' + esc(url) + '" width="100%" height="100%" frameborder="0" scrolling="no" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe>';
    ph.style.display = 'block';
    showStatus('အရန်နည်းလမ်းဖြင့် ဖွင့်ထားသည် (ကြော်ငြာ ပါနိုင်)', 'warn');
    updateBadge(false);
}

function showStatus(text, type) {
    const el = document.getElementById('stream-status');
    el.textContent = text;
    el.style.display = 'block';
    el.className = 'stream-status ' + (type || '');
    setTimeout(() => { el.style.display = 'none'; }, 8000);
}

function updateBadge(adFree) {
    const badge = document.getElementById('ads-badge');
    if (adFree) {
        badge.innerHTML = '<span class="live-dot" style="background:var(--accent)"></span><span class="lbl">ကြော်ငြာမရှိ</span>';
    } else {
        badge.innerHTML = '<span class="live-dot" style="background:var(--live)"></span><span class="lbl">ကြော်ငြာပါ</span>';
    }
}

async function init() {
    const matchId = new URLSearchParams(window.location.search).get('id');
    if (!matchId) { goHome(); return; }

    document.getElementById('player-section').style.display = 'block';
    document.getElementById('error-page').style.display = 'none';

    try {
        const detail = await api({ type: 'detail', id: matchId });
        if (!detail.success) { showError('ပွဲစဉ်အချက်အလက် ရယူရန် မရနိုင်ပါ။'); return; }
        playMatch(detail);
    } catch (e) {
        showError('ဆက်သွယ်မှု အမှားရှိနေသည်။');
    }
}

function showError(msg) {
    document.getElementById('error-page').style.display = 'block';
    document.getElementById('player-section').style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
}

async function playMatch(detail) {
    const m = detail.data.match_info;
    const info = document.getElementById('info');

    document.getElementById('i-league').innerHTML = '<img src="' + esc(m.league.flag) + '" alt="" onerror="this.style.visibility=\'hidden\'"><span>' + esc(m.league.name) + ' • ' + esc(m.league.country) + '</span>';
    document.getElementById('i-status').textContent = getStatus(m.status, m.status_detail);
    document.getElementById('i-h-badge').src = m.teams.home.badge;
    document.getElementById('i-h-name').textContent = m.teams.home.name;
    document.getElementById('i-a-badge').src = m.teams.away.badge;
    document.getElementById('i-a-name').textContent = m.teams.away.name;
    document.getElementById('i-score').textContent = m.score.display;

    const v = detail.data.info && detail.data.info.venue;
    document.getElementById('i-venue').textContent = v ? v.stadium + ' • ' + v.city : '';
    info.style.display = 'block';

    allSources = (detail.data.sources || []).filter(s => s.embedUrl);
    if (!allSources.length) {
        document.getElementById('loading').classList.remove('active');
        showStatus('ပွဲစဉ် မစတင်ရသေးပါ', 'err');
        return;
    }

    for (let i = 0; i < allSources.length && i < 4; i++) {
        if (await activateSource(allSources[i].embedUrl)) return;
    }
    fallbackEmbed(allSources[0].embedUrl);
}

init();
</script>
</body>
</html>
